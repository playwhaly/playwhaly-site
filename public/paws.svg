<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Denser paw wallpaper. Tan #C4A484 at 0.25 and periwinkle #6470C8 at 0.22,
       4 paws (2× previous density), each scaled 1.4, varied rotation.
       Opacity is on each colour group so pad and toes do not stack. -->
  <defs>
    <g id="paw">
      <ellipse cx="12" cy="15.5" rx="6.2" ry="5"/>
      <circle cx="4.8" cy="8.6" r="2.15"/>
      <circle cx="9" cy="5.8" r="2.35"/>
      <circle cx="15.2" cy="5.8" r="2.35"/>
      <circle cx="19.2" cy="8.6" r="2.15"/>
    </g>
  </defs>
  <g fill="#C4A484" opacity="0.25">
    <use href="#paw" transform="translate(12,10) rotate(-24 16.8 16.8) scale(1.4)"/>
    <use href="#paw" transform="translate(90,92) rotate(16 16.8 16.8) scale(1.4)"/>
  </g>
  <g fill="#6470C8" opacity="0.22">
    <use href="#paw" transform="translate(88,8) rotate(32 16.8 16.8) scale(1.4)"/>
    <use href="#paw" transform="translate(14,90) rotate(-36 16.8 16.8) scale(1.4)"/>
  </g>
</svg>

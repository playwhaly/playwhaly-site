<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到頁面｜威利 Whaly</title>
  <meta name="theme-color" content="#0b0f0c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0b0f0c;
      --ink: #e8f0e9;
      --muted: #9bb0a0;
      --accent: #7cff9a;
      --line: #243028;
      --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(800px 400px at 50% 0%, rgba(61, 143, 85, 0.16), transparent 60%),
        var(--bg);
      text-align: center;
    }
    .card {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.75rem 1.4rem;
      background: #121a14;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 1.2rem;
      color: var(--muted);
    }
    a {
      color: #061008;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 0.65rem 1.1rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>這頁被殭屍吃掉了</h1>
    <p>你要找的頁面不見了 可能被搬走 也可能根本不存在 先回基地吧</p>
    <a href="/">回基地</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到頁面｜威利 Whaly</title>
  <meta name="description" content="這一頁找不到，先回威利 Whaly 的小基地吧～">
  <meta name="theme-color" content="#FFF7EE">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --bg: #FFF7EE;
      --card: #FFFFFF;
      --line: #F0E3D6;
      --ink: #3A2E2A;
      --muted: #7A6A62;
      --accent: #6470C8;
      --link: #3F4A90;
      --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.5rem;
      font-family: var(--font);
      color: var(--ink);
      background-color: var(--bg);
      background-image: url("/paws.svg");
      background-repeat: repeat;
      text-align: center;
    }
    .card {
      position: relative;
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.75rem 1.4rem;
      background: var(--card);
      box-shadow: 0 4px 14px rgba(58, 46, 42, 0.06);
    }
    .hero-peek {
      position: absolute;
      top: 0;
      right: 1.2rem;
      width: 64px;
      height: 52px;
      transform: translateY(-62%);
      pointer-events: none;
      z-index: 1;
    }
    .hero-peek svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    @media (max-width: 519px) {
      .hero-peek {
        width: 54px;
        height: 44px;
        right: 0.7rem;
      }
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 1rem;
      background: #fff;
      border: 1px solid var(--line);
    }
    .mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.35;
    }
    p {
      margin: 0 0 1.2rem;
      color: var(--muted);
    }
    a {
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      transition: transform 0.15s ease;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
      <div class="hero-peek" aria-hidden="true">
        <svg viewBox="0 0 80 64" width="64" height="52" fill="none">
          <path d="M25 32 L21 16 Q27 13 36 30 Z" fill="#FFF7EE" stroke="#3A2E2A" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M55 32 L60 17 Q54 14 44 30 Z" fill="#FFF7EE" stroke="#3A2E2A" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M26 29 L24 19 L33 28 Z" fill="#6470C8"/>
          <path d="M54 29 L57 20 L47 28 Z" fill="#6470C8"/>
          <ellipse cx="40" cy="41" rx="20" ry="17" fill="#FFF7EE" stroke="#3A2E2A" stroke-width="1.6"/>
          <circle cx="32.5" cy="39" r="2.05" fill="#3A2E2A"/>
          <circle cx="47.5" cy="39.4" r="2.05" fill="#3A2E2A"/>
          <path d="M40 43.2 L38 45.8 H42 Z" fill="#3A2E2A" stroke="#3A2E2A" stroke-width="0.8" stroke-linejoin="round"/>
          <path d="M34 46.6 Q36.5 48 40 45.8 Q43.5 48 46 46.6" stroke="#3A2E2A" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M22 38 H15 M21 42 H14" stroke="#3A2E2A" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M58 38 H65 M59 42 H66" stroke="#3A2E2A" stroke-width="1.2" stroke-linecap="round"/>
          <ellipse cx="26" cy="59.5" rx="8" ry="5.4" fill="#FFF7EE" stroke="#3A2E2A" stroke-width="1.6"/>
          <ellipse cx="54" cy="59.5" rx="8" ry="5.4" fill="#FFF7EE" stroke="#3A2E2A" stroke-width="1.6"/>
        </svg>
      </div>
    <div class="mark">
      <img src="/cat-mark-circle.png" width="48" height="48" alt="威利 Whaly 的貓頭貼">
    </div>
    <h1>這頁好像跟貓一樣躲起來了🐱</h1>
    <p>你要找的頁面不見了，可能搬家了，也可能根本不存在，先回基地吧～</p>
    <a href="/">回基地</a>
  </div>
</body>
</html>

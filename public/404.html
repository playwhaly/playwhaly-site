<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到頁面｜威利 Whaly</title>
  <meta name="description" content="這一頁找不到，先回威利 Whaly 的小基地吧～">
  <meta name="theme-color" content="#FFF7EE">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --bg: #FFF7EE;
      --card: #FFFFFF;
      --line: #F0E3D6;
      --ink: #3A2E2A;
      --muted: #7A6A62;
      --accent: #5E69C2;
      --link: #3F4A90;
      --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.5rem;
      font-family: var(--font);
      color: var(--ink);
      background-color: var(--bg);
      background-image: url("/paws.svg");
      background-repeat: repeat;
      text-align: center;
    }
    .card {
      position: relative;
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.75rem 1.4rem;
      background: var(--card);
      box-shadow: 0 4px 14px rgba(58, 46, 42, 0.06);
    }
    .hero-peek {
      position: absolute;
      top: 0;
      right: 1.2rem;
      width: 64px;
      height: 52px;
      transform: translateY(-62%);
      pointer-events: none;
      z-index: 1;
    }
    .hero-peek svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    @media (max-width: 519px) {
      .hero-peek {
        width: 54px;
        height: 44px;
        right: 0.7rem;
      }
    }
    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 1rem;
      background: #fff;
      border: 1px solid var(--line);
    }
    .mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.35;
    }
    p {
      margin: 0 0 1.2rem;
      color: var(--muted);
    }
    a {
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      transition: transform 0.15s ease;
    }
    a:hover { transform: translateY(-2px); }
    .legal-foot {
      margin: 1.4rem 0 0;
      font-size: .85rem;
      color: var(--muted);
    }
    .legal-foot a {
      color: var(--link);
      background: none;
      font-weight: 700;
      display: inline;
      min-height: 0;
      padding: 0;
      border-radius: 0;
    }
    .legal-foot a:hover { transform: none; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="#6470C8"><ellipse cx="12" cy="15.5" rx="6.2" ry="5"/><circle cx="4.8" cy="8.6" r="2.15"/><circle cx="9" cy="5.8" r="2.35"/><circle cx="15.2" cy="5.8" r="2.35"/><circle cx="19.2" cy="8.6" r="2.15"/></svg></div>
    <h1>這頁好像躲起來了</h1>
    <p>你要找的頁面不見了，可能搬家了，也可能根本不存在，先回基地吧～</p>
    <a href="/">回基地</a>
  </div>
  <p class="legal-foot">
    <a href="/terms">服務條款 Terms</a>
    ·
    <a href="/privacy">隱私權政策 Privacy</a>
  </p>
</body>
</html>

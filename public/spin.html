    <div class="brand"><a href="/"><span class="dot"><svg fill="#6470C8" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="6.2" ry="5"/><circle cx="4.8" cy="8.6" r="2.15"/><circle cx="9" cy="5.8" r="2.35"/><circle cx="15.2" cy="5.8" r="2.35"/><circle cx="19.2" cy="8.6" r="2.15"/></svg></span>威利 Whaly</a></div>

      <a class="pill keep is-active" aria-current="page" href="/spin">今天玩什麼</a>
    </nav>
  </header>

  <div class="page-kicker">
    <p class="eyebrow">今天玩什麼？</p>
    <h1>轉一下</h1>
    <p class="lede">從還沒玩的遊戲裡抽一個。可以先用平台或類型縮小範圍。</p>
  </div>

  <div class="spin-layout">
    <section class="panel wheel-panel" aria-labelledby="wheel-title">
      <div class="wheel-head">
        <h2 id="wheel-title">未玩遊戲轉盤</h2>
        <button type="button" class="fx-toggle" id="fx-toggle" aria-pressed="false" title="特效預設關閉">特效：關</button>
      </div>
      <div class="filters" aria-label="篩選">
        <select class="select" id="platform" aria-label="平台">
          <option value="">全部平台</option>
          <option value="pc">PC (Windows)</option>
          <option value="ps4">Sony PlayStation 4</option>
          <option value="ps5">Sony PlayStation 5</option>
        </select>
        <select class="select" id="genre" aria-label="類型"><option value="">全部類型</option></select>
        <span class="filter-chip is-on" id="pool-count">未玩 0 款</span>
      </div>
      <div class="wheel-wrap">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <div class="wheel" id="wheel" aria-hidden="true"></div>
        <div class="wheel-hub" aria-hidden="true"><svg fill="#6470C8" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="6.2" ry="5"/><circle cx="4.8" cy="8.6" r="2.15"/><circle cx="9" cy="5.8" r="2.35"/><circle cx="15.2" cy="5.8" r="2.35"/><circle cx="19.2" cy="8.6" r="2.15"/></svg></div>
        <div class="paw-burst" id="paw-burst" hidden aria-hidden="true"></div>
      </div>
      <button class="btn btn-primary spin-btn" id="spin-btn" type="button">轉！</button>
      <p class="spin-hint">每次會從篩選後還沒玩的遊戲裡新抽 8 到 12 款放上轉盤。可以用上面的篩選縮小範圍。</p>
    </section>

    <section class="panel result" aria-labelledby="result-title">
      <div class="result-head">
        <h2 id="result-title">抽到這一款</h2>
      </div>
      <div id="result"><p class="result-placeholder">按「轉！」從還沒玩的遊戲裡抽一個。</p></div>
    </section>
  </div>
